name: contracts

permissions: {}

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No submodules: dependencies are managed by Soldeer and restored below.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # dependencies/ is gitignored, so it must be restored from soldeer.lock
      # before anything can compile.
      - name: Restore dependencies
        run: forge soldeer install --config-location foundry

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # One identifier, one meaning. Fails the build if a
      # constant name is declared in more than one file.
      - name: Constant shadowing check
        run: |
          dupes=$(grep -rhoE '\b(constant|immutable)\s+[A-Z][A-Z0-9_]{2,}\b' src/ \
            | grep -oE '[A-Z][A-Z0-9_]{2,}$' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate constant names across files:"; echo "$dupes"; exit 1
          fi
          echo "no duplicate constant names"
