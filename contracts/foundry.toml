[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]

solc_version = "0.8.28"
# forge silently downgrades an evm_version that solc cannot support
evm_version = "cancun"
optimizer = true
# runtime gas matters most: the rule ladder runs on every transfer
optimizer_runs = 10000
via_ir = false

# remappings are written out below, never guessed
auto_detect_remappings = false

remappings = [
    "forge-std/=dependencies/forge-std-1.16.2/src/",
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/contracts/",
    "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.7.0/contracts/",
    "@fhevm/solidity/=dependencies/@fhevm-solidity-0.11.1/",
    "encrypted-types/=dependencies/@encrypted-types-0.0.4/",
    "forge-fhevm/=dependencies/forge-fhevm-3ee696f/src/",
    "@fhevm/host-contracts/=dependencies/forge-fhevm-3ee696f/src/fhevm-host/",
]

# keep storage layouts with the build artifacts
extra_output_files = ["storageLayout"]

bytecode_hash = "none"
cbor_metadata = false

# the engine inlines the FHE library and exceeds EIP-170 at 10000 runs
additional_compiler_profiles = [{ name = "size", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/compliance/engine/PropaneComplianceEngine.sol", optimizer_runs = 200 }]

# each top-level call is its own transaction, as fhEVM HCU and transient grants require
isolate = true

[profile.ci]
verbosity = 4

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[soldeer]
# dependencies are gitignored; foundry.toml and soldeer.lock are the source of truth
recursive_deps = false
# the remappings key above stays the only list
remappings_generate = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.7.0" }
"@openzeppelin-contracts-upgradeable" = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", tag = "v5.7.0" }
"@fhevm-solidity" = "0.11.1"
"@encrypted-types" = "0.0.4"
forge-fhevm = { version = "3ee696f", git = "https://github.com/zama-ai/forge-fhevm.git", rev = "3ee696fba62a32314fde457de28cc29f1191c4cb" }
