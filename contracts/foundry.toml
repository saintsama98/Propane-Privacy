[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]

# --- Bucket 0 / D5: pin everything. Nothing here may be left to defaults. ---
# Target: Ethereum mainnet. Mainnet is on Fusaka (Dec 2025), so cancun is
# deploy-safe by construction. cancun is also solc 0.8.28's own default and is
# the newest level whose opcodes this codebase actually uses (TSTORE/TLOAD for
# reentrancy guards, MCOPY). prague/osaka add nothing at the codegen level here.
# NOTE: forge silently downgrades an evm_version the pinned solc cannot support
# (osaka -> prague, no warning). Verify with `forge build --build-info`.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# D2 = option C (modular rules) keeps every contract far below EIP-170, so the
# size/runtime trade can be spent on runtime gas instead of bytecode. The rule
# ladder runs on every transfer and this deploys to mainnet, so runtime gas is
# the scarce resource. `forge build --sizes` in CI is the guard.
optimizer_runs = 10000
via_ir = false

# Remappings are declared explicitly, never guessed. Soldeer writes generated
# paths and auto-detection disagrees with them; the resulting errors are hard
# to read. Matches the OriginProtocol/origin-dollar configuration.
auto_detect_remappings = false

# Declared explicitly rather than relying on Soldeer's version-suffixed generated
# paths, which do not match the "@openzeppelin/contracts/..." prefix the
# upgradeable library uses for its own imports. Prefixes taken from upstream:
# dependencies/@openzeppelin-contracts-upgradeable-5.7.0/remappings.txt
remappings = [
    "forge-std/=dependencies/forge-std-1.16.2/src/",
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/contracts/",
    "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.7.0/contracts/",
    # FHE stack (W4/W6). Zama's Solidity library and encrypted types, plus forge-fhevm, which deploys the
    # real fhEVM host contracts inside forge tests with mock signers. forge-fhevm is test-only.
    "@fhevm/solidity/=dependencies/@fhevm-solidity-0.11.1/",
    "encrypted-types/=dependencies/@encrypted-types-0.0.4/",
    "forge-fhevm/=dependencies/forge-fhevm-3ee696f/src/",
    "@fhevm/host-contracts/=dependencies/forge-fhevm-3ee696f/src/fhevm-host/",
]

# Bucket 0 / done-criteria 5: storage layout is a committed golden artifact.
extra_output_files = ["storageLayout"]

bytecode_hash = "none"
cbor_metadata = false

# The compliance engine inlines the FHE library heavily and exceeds EIP-170 at 10000 runs. It is
# compiled with a size-oriented profile; its runtime cost is dominated by FHE operations, which the
# optimizer does not affect. Every other contract keeps the default profile.
additional_compiler_profiles = [{ name = "size", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/compliance/orbex/propaneEngine.sol", optimizer_runs = 200 }]

# fhEVM tracks per-transaction HCU and transient ACL grants in transient storage. Without isolation a
# whole test function runs as one transaction, which both overstates HCU and hides missing persistent
# grants (it masked a real total-supply ACL bug). Every top-level call is its own transaction.
isolate = true

[profile.ci]
verbosity = 4

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[soldeer]
# Dependencies are vendored into dependencies/ and gitignored; foundry.toml and
# soldeer.lock are the committed source of truth.
recursive_deps = false
# Soldeer otherwise rewrites remappings.txt on every install with
# version-suffixed paths, duplicating the explicit list above. One source of
# truth: the `remappings` key in [profile.default].
remappings_generate = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.7.0" }
"@openzeppelin-contracts-upgradeable" = { version = "5.7.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", tag = "v5.7.0" }
"@fhevm-solidity" = "0.11.1"
"@encrypted-types" = "0.0.4"
forge-fhevm = { version = "3ee696f", git = "https://github.com/zama-ai/forge-fhevm.git", rev = "3ee696fba62a32314fde457de28cc29f1191c4cb" }
